name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The floor @sparticuz/chromium supports, and the version Vercel runs.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium for the lab
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # Fails the build if the clean control app produces any finding, or if a
      # safety rule breaks (Pay pressed, exfil origin reached). Recall is
      # printed, not gated: a missed defect is a regression to investigate,
      # a false positive or a safety breach is a defect to fix before merging.
      - name: Benchmark against the lab
        env:
          OWLY_ENV: test
        run: npx tsx lab/bench.ts
