<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Nimbus</title>
<style>
  :root { --ink:#11131a; --dim:#5b6270; --line:#e5e7eb; --brand:#3b5bdb; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f7f8fa; }
  header { padding:20px 28px; border-bottom:1px solid var(--line); background:#fff; }
  .logo { font-weight:700; letter-spacing:-.02em; }
  main { max-width:400px; margin:56px auto; background:#fff; border:1px solid var(--line); border-radius:14px; padding:32px; }
  h1 { font-size:22px; margin:0 0 20px; letter-spacing:-.02em; }
  label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
  input { width:100%; padding:11px 13px; border:1px solid #cbd0d8; border-radius:9px; font-size:15px; font-family:inherit; }
  input:focus { outline:2px solid var(--brand); outline-offset:1px; border-color:var(--brand); }
  button { width:100%; margin-top:24px; background:var(--brand); color:#fff; border:0; border-radius:9px;
           padding:13px; font-size:16px; font-weight:600; font-family:inherit; cursor:pointer; }
  .alt { text-align:center; margin-top:18px; font-size:14px; color:var(--dim); }
  .alt a { color:var(--brand); }
</style>
</head>
<body>
<header><span class="logo">Nimbus</span></header>
<main>
  <h1>Sign in</h1>
  <form id="f">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p class="alt">No account yet? <a href="/signup.html">Create a free account</a></p>
</main>
<script>
  document.getElementById("f").addEventListener("submit", function (e) { e.preventDefault(); });
</script>
</body>
</html>
