<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owly</title>
<meta name="description" content="Give Owly a web address. It opens your site in a real browser, tries what a new user would try, and tells you where it breaks - with proof.">
<link rel="icon" href="/icon-32.png" sizes="32x32">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f7f1e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17162a" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Owly">
<meta property="og:description" content="An autonomous QA agent. Give it a web address and watch it work.">
<meta property="og:image" content="https://tryowly.vercel.app/logo.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // Before first paint, so a dark-mode visitor never gets a white flash.
  try {
    var t = localStorage.getItem("owly-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
</head>
<body>

<header class="top">
  <a class="mark" href="/"><img src="/icon-64.png" alt="" width="28" height="28" decoding="async"> Owly</a>
  <nav>
    <a class="hide-sm" href="/how-it-works">How it works</a>
    <a class="hide-sm" href="/demo-report">A real report</a>
    <a class="hide-sm" href="/pricing">Pricing</a>
    <a href="https://joinpond.ai" rel="noopener">Pond</a>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch between light and dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </nav>
</header>

<main>
  <div class="scroll empty" id="scroll">
    <div class="col">

      <div class="hello" id="hello">
        <img src="/icon-192.png" alt="" width="68" height="68" decoding="async">
        <h1>What should I test?</h1>
        <p>Give me a web address. I open it in a real browser and tell you what breaks.</p>
      </div>

      <div class="thread" id="thread"></div>

    </div>
  </div>

  <div class="dock">
    <div class="col">
      <form class="box" id="composer" autocomplete="off">
        <label for="say" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message Owly</label>
        <textarea id="say" rows="1" placeholder="Ask anything, or paste a web address"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>

      <div class="meta">
        <span class="chip" id="left" title="Free tests left today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <b>3</b> left today
        </span>
        <a class="chip" href="/how-it-works" title="Owly only looks at a site until you verify it is yours">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
          Look only
        </a>
      </div>
    </div>
  </div>
</main>

<script src="/assets/app.js" defer></script>
</body>
</html>
