<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Owly</title>
<meta name="description" content="Give Owly a web address. It opens your site in a real browser, tries what a new user would try, and tells you where it breaks - with proof.">
<link rel="icon" href="/icon-32.png" sizes="32x32">
<link rel="icon" href="/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#f7f1e4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17162a" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Owly">
<meta property="og:description" content="An autonomous QA agent. Give it a web address and watch it work.">
<meta property="og:image" content="https://tryowly.vercel.app/logo.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // Before first paint, so a dark-mode visitor never gets a white flash.
  try {
    var t = localStorage.getItem("owly-theme");
    if (t) document.documentElement.setAttribute("data-theme", t);
    if (localStorage.getItem("owly-rail") === "closed") document.documentElement.classList.add("rail-closed");
  } catch (e) {}
</script>
</head>
<body>

<div class="shell">

  <aside class="rail" id="rail" aria-label="Your tests">
    <div class="rail-top">
      <a class="mark" href="/"><img src="/icon-64.png" alt="" width="26" height="26" decoding="async"> Owly</a>
      <button class="icon-btn" id="rail-close" type="button" aria-label="Hide the sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <button class="newchat" id="newchat" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      New test
    </button>

    <nav class="rail-nav" aria-label="Owly">
      <a href="/how-it-works">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        How it works
      </a>
      <a href="/demo-report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
        A real report
      </a>
      <a href="/pricing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 13.4 12 22l-9-9V4a1 1 0 0 1 1-1h9z"/><path d="M7.5 7.5h.01"/></svg>
        Pricing
      </a>
      <a href="https://joinpond.ai" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12c3-4 6-6 10-6s8 2 10 6c-3 4-6 6-10 6s-7-2-10-6z"/><circle cx="12" cy="12" r="2.5"/></svg>
        Owly on Pond
      </a>
    </nav>

    <div class="recents-head">Recents</div>
    <nav class="past" id="past" aria-label="Earlier conversations"></nav>

    <div class="rail-foot">
      <button class="railtheme" id="theme-rail" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        Light or dark
      </button>
    </div>
  </aside>

  <div class="rail-veil" id="rail-veil" hidden></div>

  <div class="main-col">
    <header class="top">
      <button class="icon-btn" id="rail-open" type="button" aria-label="Show the sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <a class="mark top-mark" href="/"><img src="/icon-64.png" alt="" width="26" height="26" decoding="async"> Owly</a>
      <div class="spacer"></div>
    </header>

    <main>
      <div class="scroll empty" id="scroll">
        <div class="col">

          <div class="hello" id="hello">
            <img src="/icon-192.png" alt="" width="62" height="62" decoding="async">
            <h1>What should I test?</h1>
            <p>Give me a web address. I open it in a real browser and tell you what breaks.</p>
          </div>

          <div class="thread" id="thread"></div>

        </div>
      </div>

      <div class="dock">
        <div class="col">
          <form class="box" id="composer" autocomplete="off">
            <label for="say" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message Owly</label>
            <textarea id="say" rows="1" placeholder="Ask about a site, or paste a web address&hellip;"></textarea>
            <div class="box-foot">
              <span class="chip" id="left" title="Free tests left today">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
                <b>3</b>&nbsp;left today
              </span>
              <div class="spacer"></div>
              <button class="ghost-btn" id="explain" type="button" title="What can I ask?" aria-label="What can I ask?">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg>
              </button>
              <button class="send" id="send" type="submit" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
              </button>
            </div>
          </form>
          <p class="under">Unverified sites are read, never typed into. <a href="/how-it-works">How it works</a></p>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="/assets/app.js" defer></script>
</body>
</html>
